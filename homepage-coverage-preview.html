'use strict';const D=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const rowMap=new Map(D.rows.map(r=>[r.id,r]));

const boundary=D.rows[4]?.count,extra=D.rows.slice(5).filter(r=>r.count===boundary).length;$('ties').textContent=extra?`另有${extra}个模型同为${boundary}项，完整列表可查看。`:'';$('date').textContent=`本站快照：${D.date}`;
function showModel(id){const r=rowMap.get(id);$('detail-content').innerHTML=`<p>已上榜评测</p><h2>${esc(r.name)}</h2><p>上榜${r.count}项 / 共${D.total}项，按不同评测去重。以下配置数不额外增加上榜次数。</p><ul>${r.hits.map(b=>`<li><a href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.name)} ↗</a><small>${b.configCount}条配置成绩</small></li>`).join('')}</ul>`;if(!$('details').open)$('details').showModal();$('details').scrollTop=0;}
